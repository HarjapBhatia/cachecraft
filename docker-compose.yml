services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cachecraft
      POSTGRES_USER: cachecraft
      POSTGRES_PASSWORD: cachecraft
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cachecraft -d cachecraft"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./scripts/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  # Base API service template reused by api-1, api-2, and api-3
  api-1: &api
    build: .
    environment:
      CACHECRAFT_INSTANCE_NAME: api-1
      PORT: "8080"
      DATABASE_URL: postgres://cachecraft:cachecraft@postgres:5432/cachecraft?sslmode=disable
      REDIS_ADDR: redis:6379
      DB_MAX_CONNS: "20"
      DB_CONN_TIMEOUT_MS: "2000"
      DEFAULT_TTL_SECONDS: "30"
      DEFAULT_JITTER: "0.10"
      LOCK_LEASE_MS: "5000"
      CACHECRAFT_ENV: local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: ["8081:8080"]

  api-2:
    <<: *api
    environment:
      CACHECRAFT_INSTANCE_NAME: api-2
      PORT: "8080"
      DATABASE_URL: postgres://cachecraft:cachecraft@postgres:5432/cachecraft?sslmode=disable
      REDIS_ADDR: redis:6379
      DB_MAX_CONNS: "20"
      DB_CONN_TIMEOUT_MS: "2000"
      DEFAULT_TTL_SECONDS: "30"
      DEFAULT_JITTER: "0.10"
      LOCK_LEASE_MS: "5000"
      CACHECRAFT_ENV: local
    ports: ["8082:8080"]

  api-3:
    <<: *api
    environment:
      CACHECRAFT_INSTANCE_NAME: api-3
      PORT: "8080"
      DATABASE_URL: postgres://cachecraft:cachecraft@postgres:5432/cachecraft?sslmode=disable
      REDIS_ADDR: redis:6379
      DB_MAX_CONNS: "20"
      DB_CONN_TIMEOUT_MS: "2000"
      DEFAULT_TTL_SECONDS: "30"
      DEFAULT_JITTER: "0.10"
      LOCK_LEASE_MS: "5000"
      CACHECRAFT_ENV: local
    ports: ["8083:8080"]

  nginx:
    image: nginx:1.27-alpine
    depends_on: [api-1, api-2, api-3]
    ports: ["8080:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres-data:
  redis-data:
