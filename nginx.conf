# nginx.conf
# Configures the Nginx reverse proxy to distribute incoming requests across
# the 3 CacheCraft Go API instances using round-robin load balancing.
#
# ROLE IN THE TOPOLOGY:
# Clients and load-testing tools (such as k6) send requests to Nginx on port 8080.
# Nginx forwards these requests to api-1:8080, api-2:8080, and api-3:8080 in turn.
#
# WHY TEST BEHIND A LOAD BALANCER?
# In real production architectures, multiple API instances share a centralized
# database and cache. Testing with 3 API instances allows us to demonstrate:
#   1. Local Single-Flight limitation: In-memory request coalescing protects
#      only the single node handling the request, resulting in 1 query per node
#      (3 queries globally across the cluster).
#   2. Distributed Lock strength: Redis SET NX coordinates all 3 nodes, resulting
#      in strictly 1 query globally across the entire cluster.

upstream cachecraft_api {
    # Default balancing algorithm is round-robin: requests are evenly distributed
    # 1 -> api-1, 2 -> api-2, 3 -> api-3, 4 -> api-1, etc.
    server api-1:8080;
    server api-2:8080;
    server api-3:8080;
}

server {
    listen 80;

    # Forward all item API requests to the upstream Go API pool
    location /api/ {
        proxy_pass http://cachecraft_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Forward all debug and administrative requests to the upstream Go API pool
    location /debug/ {
        proxy_pass http://cachecraft_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
